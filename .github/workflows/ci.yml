# 跑什麼、為什麼不跑 e2e 與 bench --check：docs/development.md〈全部檢查〉、plan〈開發環境與閘門〉。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 全部歷史：密鑰掃描要看每個 commit，擋掉 commit 時用 --no-verify 跳過 hook 的。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 不給 toolchain input：版本、components、targets 都讀 rust-toolchain.toml；內建 cargo 快取。
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      # 版本要與 Cargo.lock 的 wasm-bindgen 相同，不同時 check 的 wasm 步驟會擋下。
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
          fallback: none

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 版本與 docs/development.md〈環境需求〉相同；install-action 沒有 gitleaks，下載 release 並驗 checksum。
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@v2
        with:
          tool: osv-scanner@2.7.1
          fallback: none

      - run: npm ci --prefix web

      # check 的 secrets 步驟只看暫存區，CI 沒有暫存的改動，這裡全掃歷史。
      - run: gitleaks git --redact --verbose --no-banner

      - run: cargo xtask check --fast

      - run: cargo test --workspace

      # 同 check 的 audit 步驟（--fast 跳過它）。
      - run: osv-scanner scan source --config=osv-scanner.toml --lockfile=Cargo.lock --lockfile=web/package-lock.json
