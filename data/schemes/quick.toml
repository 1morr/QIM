# 速成輸入方案。欄位見 docs/plan.md §2.5；由 qim-databuild 編進資料包，qim-core 不讀 TOML。

id = "quick"
name = "速成"
version = "1"
alphabet = "abcdefghijklmnopqrstuvwxy"
max_code_length = 2
wildcard = "z" # 萬用鍵（plan §2.5）：代替任一碼，速成只用 a–y；macOS 倉頡也用 Z

[packs] # 另外的資料包的 id，由 qim-databuild 建到 build/packs/<id>/
lexicon = "quick-lexicon"
language_model = "zh-hant-bigram" # 字級 bigram（plan §4.3）
word_trigram = "zh-hant-word-trigram" # 詞級 trigram 預算版（plan §4.3）；放寬版 zh-hant-word-trigram-large 也會建
radical_hint = "cangjie-hint"     # 字根提示用的倉頡三代 / 五代碼，不進 lattice（ADR 0003）

[ranking] # 連打的打分（plan §2.3）；M1 票 12 在 dev 切分上格點搜尋，個人集只當守門，過程在票 12 的 Comments
word_bonus = 1.0      # β：每個詞庫的段加的分；再低 dev 會好，但個人集（多是兩字詞）答錯變多
segment_penalty = 1.0 # γ：每一段扣的分；β − γ 是詞比拆成單字多拿的分
beam = 20             # 每個位置保留的部分路徑數（libime 預設）；放寬到 40 dev 只差 1 題
sentences = 3         # 候選列最多放幾條多段路徑；放多：維基集修正次數降、口語集升

[radicals] # 鍵 → 字根，組字與鍵盤標籤用
a = "日"
b = "月"
c = "金"
d = "木"
e = "水"
f = "火"
g = "土"
h = "竹"
i = "戈"
j = "十"
k = "大"
l = "中"
m = "一"
n = "弓"
o = "人"
p = "心"
q = "手"
r = "口"
s = "尸"
t = "廿"
u = "山"
v = "女"
w = "田"
x = "難"
y = "卜"
z = "＊" # 萬用鍵在組字裡的記號
