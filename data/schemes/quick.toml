# 速成輸入方案。欄位見 docs/plan.md §2.5；由 qim-databuild 編進資料包，qim-core 不讀 TOML。

id = "quick"
name = "速成"
version = "1"
alphabet = "abcdefghijklmnopqrstuvwxy"
max_code_length = 2

[packs] # 另外的資料包的 id，由 qim-databuild 建到 build/packs/<id>/
lexicon = "quick-lexicon"

[ranking] # 連打的打分（plan §2.3）；M1 票 07 用基準粗調（β −2–4、γ 0–6），細調在票 12
word_bonus = 2.0      # β：每個詞庫的段加的分
segment_penalty = 0.0 # γ：每一段扣的分
beam = 20             # 每個位置保留的部分路徑數（libime 預設）
sentences = 3         # 候選列最多放幾條多段路徑；放多：維基集修正次數降、口語集升

[radicals] # 鍵 → 字根，組字與鍵盤標籤用
a = "日"
b = "月"
c = "金"
d = "木"
e = "水"
f = "火"
g = "土"
h = "竹"
i = "戈"
j = "十"
k = "大"
l = "中"
m = "一"
n = "弓"
o = "人"
p = "心"
q = "手"
r = "口"
s = "尸"
t = "廿"
u = "山"
v = "女"
w = "田"
x = "難"
y = "卜"
