# 資料來源（plan §4）：每個來源釘版本（git 來源填 commit）與每個檔的 sha256。
# qim-databuild 下載到 repo 外的快取（docs/development.md〈資料建置〉），sha256 不符就失敗；換版本時改 version、url 與 sha256。
# 資料進資料包的來源要寫 license_text，三選一：statement（照抄上游檔裡的聲明）、upstream_file（上游釘住的授權檔整份）、
# repo_file（repo 裡存的全文）。

[source.libcangjie]
repository = "https://gitlab.freedesktop.org/cangjie/libcangjie"
version = "346026b8ccf4ffdfbe424400edb6a588c0c5ba8e"
license = "Public Domain"

# 授權聲明所在的檔（files 之一），與照抄的聲明原文；建置時核對原文確實在檔內，再寫進資料包的 LICENSE。
[source.libcangjie.license_text.statement]
file = "data/README.table.md"
quote = "The data in the ``table.txt`` file is hereby placed under the Public Domain, in the hope that is is useful."

