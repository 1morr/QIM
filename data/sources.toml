# 資料來源（plan §4）：每個來源釘版本（git 來源填 commit）與每個檔的 sha256。
# qim-databuild 下載到 .cache/sources/，sha256 不符就失敗；換版本時改 version、url 與 sha256。

[source.libcangjie]
repository = "https://gitlab.freedesktop.org/cangjie/libcangjie"
version = "346026b8ccf4ffdfbe424400edb6a588c0c5ba8e"
license = "Public Domain"
# 授權聲明所在的檔，與照抄的聲明原文；建置時核對原文確實在檔內，再寫進資料包的 LICENSE。
license_file = "data/README.table.md"
license_statement = "The data in the ``table.txt`` file is hereby placed under the Public Domain, in the hope that is is useful."

[[source.libcangjie.files]]
path = "data/table.txt"
url = "https://gitlab.freedesktop.org/cangjie/libcangjie/-/raw/346026b8ccf4ffdfbe424400edb6a588c0c5ba8e/data/table.txt"
sha256 = "86118f2a50591b837e3317a3dab87f96e7188c54046e8ed20dd4a0933877d3ea"

[[source.libcangjie.files]]
path = "data/README.table.md"
url = "https://gitlab.freedesktop.org/cangjie/libcangjie/-/raw/346026b8ccf4ffdfbe424400edb6a588c0c5ba8e/data/README.table.md"
sha256 = "5962758f991e9119dddf78391202443731264332ea6b1f013791ba599fcb1b5d"

# kGradeLevel 給速成碼表排字序（plan §4.1），進資料包；kCangjie 只用來交叉比對
# libcangjie 的倉頡三代碼（plan §4.5）。兩欄都在 zip 裡的 Unihan_DictionaryLikeData.txt，
# 檔頭指向 https://www.unicode.org/terms_of_use.html，其中 Data Files 適用 Unicode License V3。
[source.unihan]
repository = "https://www.unicode.org/Public/18.0.0/ucd/"
version = "18.0.0"
license = "Unicode-3.0"
# Unicode License V3 要求整份版權與許可聲明隨副本出現。上游 https://www.unicode.org/license.txt
# 沒有版本化的網址、每年改版權年份，釘 sha256 會讓乾淨建置過期失敗，所以全文存在 repo。
license_text = "data/licenses/Unicode-3.0.txt"

[[source.unihan.files]]
path = "Unihan.zip"
url = "https://www.unicode.org/Public/18.0.0/ucd/Unihan.zip"
sha256 = "4c93ea9c1f636451729a840978f1667a53886af37ba854fdcce109721c63d43e"
