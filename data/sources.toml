# 中文維基（plan §4.3）：bench/corpus/zh-wiki.tsv 與 bigram、字頻的訓練語料；只有字頻進詞庫資料包。
# 取自 Internet Archive 的長期存檔，不用 dumps.wikimedia.org：官方站對 zhwiki 這種大站實測只留約 7 個月
# （2026-11-04 只列 20260401–20261101，20240101 回 404），小站 zh_yuewiki 卻幾乎全留；保留期數沒有官方明文。
# 鏡像站（your.org、accum.se）保留得更短。XML dump 另預告 2027-01 停用（dumps.wikimedia.org 首頁）。
# archive.org 的 zhwiki-YYYYMMDD item 到 20220501 為止（meta 的 Mirroring 頁說 2023-11-29 起沒更新），
# 這是能長期下載到同一個檔的最近一期；換期要整個來源重釘（網址、日期、sha256），不能只改日期。
# 抽樣：只取第一個分片 pages-articles1（page id 1–187712，約 204 MB），分片內每篇條目都用，不再抽。
# 篇數由分片決定、依 dump 順序，同一個檔永遠抽出同一批；其餘分片不下載。取用與抽內文的規則同 yue_wiki。
# sha256 自己算；archive.org 公布的 sha1 是 a53ef937244e2c1af8fb9513bc17f1ea009554ac（item 的 _files.xml），兩者都核對過。
