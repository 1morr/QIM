# 資料來源（plan §4）：每個來源釘版本（git 來源填 commit）與每個檔的 sha256。
# qim-databuild 下載到 repo 外的快取（docs/development.md〈資料建置〉），sha256 不符就失敗；換版本時改 version、url 與 sha256。
# 資料進資料包的來源要寫 license_text，三選一：statement（照抄上游檔裡的聲明）、upstream_file（上游釘住的授權檔整份）、
# repo_file（repo 裡存的全文）。

[source.libcangjie]
repository = "https://gitlab.freedesktop.org/cangjie/libcangjie"
version = "346026b8ccf4ffdfbe424400edb6a588c0c5ba8e"
license = "Public Domain"

# 授權聲明所在的檔（files 之一），與照抄的聲明原文；建置時核對原文確實在檔內，再寫進資料包的 LICENSE。
[source.libcangjie.license_text.statement]
file = "data/README.table.md"
quote = "The data in the ``table.txt`` file is hereby placed under the Public Domain, in the hope that is is useful."

[[source.libcangjie.files]]
path = "data/table.txt"
url = "https://gitlab.freedesktop.org/cangjie/libcangjie/-/raw/346026b8ccf4ffdfbe424400edb6a588c0c5ba8e/data/table.txt"
sha256 = "86118f2a50591b837e3317a3dab87f96e7188c54046e8ed20dd4a0933877d3ea"

[[source.libcangjie.files]]
path = "data/README.table.md"
url = "https://gitlab.freedesktop.org/cangjie/libcangjie/-/raw/346026b8ccf4ffdfbe424400edb6a588c0c5ba8e/data/README.table.md"
sha256 = "5962758f991e9119dddf78391202443731264332ea6b1f013791ba599fcb1b5d"

# kGradeLevel 給速成碼表排字序（plan §4.1），進資料包；kCangjie 只用來交叉比對
# libcangjie 的倉頡三代碼（plan §4.5）。兩欄都在 zip 裡的 Unihan_DictionaryLikeData.txt，
# 檔頭指向 https://www.unicode.org/terms_of_use.html，其中 Data Files 適用 Unicode License V3。
[source.unihan]
repository = "https://www.unicode.org/Public/18.0.0/ucd/"
version = "18.0.0"
license = "Unicode-3.0"
# Unicode License V3 要求整份版權與許可聲明隨副本出現。上游 https://www.unicode.org/license.txt
# 沒有版本化的網址、每年改版權年份，釘 sha256 會讓乾淨建置過期失敗，所以全文存在 repo。
license_text = { repo_file = "data/licenses/Unicode-3.0.txt" }

[[source.unihan.files]]
path = "Unihan.zip"
url = "https://www.unicode.org/Public/18.0.0/ucd/Unihan.zip"
sha256 = "4c93ea9c1f636451729a840978f1667a53886af37ba854fdcce109721c63d43e"

# 粵語維基（plan §4.3）：首選字基準的 bench/corpus/yue-wiki.tsv 與 bigram、字頻的訓練語料；只有字頻進詞庫資料包。
# 用 pages-articles 自己抽內文：CirrusSearch 內容 dump 已搬到 other/cirrus_search_index/、
# 只留最近約 5 週，釘了會很快下載不到；pages-articles 的舊版仍可下載（20240101 回 200，2026-11-04 查）。
# 取用：主名字空間（ns 0）、非重定向頁面最新版的 wikitext，抽內文的規則在 crates/qim-databuild/src/wikitext.rs。
# sha256 自己算；Wikimedia 公告的 sha1 是 8bbf1efcda7c2ae2800d9406fb1892a8feb84d9c（dumpstatus.json），兩者都核對過。
# 期限：小站的舊 dump 目前幾乎全留，但 XML dump 預告 2027-01 停用，archive.org 也沒有 zh_yuewiki 2026 的存檔；
# 停用前要換成能長期下載的取法並重釘（plan §8）。
# 各語料 train 切分的字頻進詞庫資料包（plan §4.2），所以四份語料都要寫授權。Creative Commons 的
# 法律文本存在 repo：它不是資料來源、沒有可釘的 commit；全文取自 creativecommons.org 各授權的
# legalcode.txt（2026-11-04）。
[source.yue_wiki]
repository = "https://dumps.wikimedia.org/zh_yuewiki/"
version = "20261101"
license = "CC-BY-SA-4.0"
license_text = { repo_file = "data/licenses/CC-BY-SA-4.0.txt" }

[[source.yue_wiki.files]]
path = "zh_yuewiki-20261101-pages-articles.xml.bz2"
