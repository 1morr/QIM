# xcodegen 的專案描述；產生的 QIMKeyboardExp.xcodeproj 不進 git（README〈建置與安裝〉）。
name: QIMKeyboardExp
# 票 11 的神經模型探針要 candle 的靜態庫與 118 MB 的模型檔，預設不併進來；
# `QIM_NEURAL=YES xcodegen generate` 才併（README〈小型神經模型（票 11）〉）。
include:
  - path: neural.yml
    enable: ${QIM_NEURAL}
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  QIMKeyboardExp:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QIM 實驗
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        QIMAppGroup: $(QIM_APP_GROUP)
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [$(QIM_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QIM_BUNDLE_PREFIX).exp
    dependencies:
      - target: QIMKeyboard
        embed: true
  QIMKeyboard:
    type: app-extension
    platform: iOS
    # 票 08：核心的 Swift 綁定、每鍵延遲的量法、資料包與延遲的輸入都由 core.sh 備好（README〈接上核心（票 08）〉）。
    sources:
      - Keyboard
      - Shared
      - ../ffi-swift/Latency.swift
      - ../../../build/ffi/swift/qim.swift
      - path: ../../../build/packs/quick/quick.pack
        buildPhase: resources
      - path: ../../../build/packs/quick-lexicon/quick-lexicon.pack
        buildPhase: resources
      - path: ../../../build/packs/zh-hant-bigram/zh-hant-bigram.pack
        buildPhase: resources
      - path: ../../../build/packs/opencc-hk2s/opencc-hk2s.pack
        buildPhase: resources
      - path: ../../../build/packs/scowl-en-us/scowl-en-us.pack
        buildPhase: resources
      # 票 09：字根提示只為了量記憶體。
      - path: ../../../build/packs/cangjie-hint/cangjie-hint.pack
        buildPhase: resources
      - path: ../../../build/ffi/latency-inputs.txt
        buildPhase: resources
    dependencies:
      - framework: ../../../build/ffi/QimFFI.xcframework
        embed: false
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: QIM 實驗鍵盤
        QIMAppGroup: $(QIM_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hant
            RequestsOpenAccess: false
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(QIM_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QIM_BUNDLE_PREFIX).exp.keyboard
