<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kbtest</title><style>body{font:16px sans-serif;margin:8px}input,textarea{font:18px sans-serif;width:95%;margin:2px 0}label{font-size:12px;color:#555}#out{font:13px monospace;white-space:pre-wrap;background:#eee;padding:4px;min-height:3em}</style></head><body>
<div style="display:flex;gap:4px"><div id="out" style="flex:1">-</div><button id="clr" style="width:90px;font-size:18px">CLEAR</button></div>
<label>textarea</label><textarea id="ta" rows="2"></textarea>
<label>text</label><input id="text" type="text">
<label>email</label><input id="email" type="email">
<label>url</label><input id="url" type="url">
<label>number</label><input id="number" type="number">
<label>tel</label><input id="tel" type="tel">
<label>inputmode=numeric</label><input id="numeric" type="text" inputmode="numeric">
<label>search</label><input id="search" type="search">
<label>password</label><input id="password" type="password">
<script>
const out=document.getElementById('out');
function rep(e){const t=e.target;let s=t.selectionStart,v=t.value;const shown=(s==null)?v:v.slice(0,s)+'|'+v.slice(s);
out.textContent=t.id+': '+JSON.stringify(shown);
fetch('/log',{method:'POST',body:JSON.stringify({id:t.id,type:e.type,it:e.inputType||'',data:e.data??null,value:v,sel:s})}).catch(()=>{});}
for(const el of document.querySelectorAll('input,textarea')){el.addEventListener('input',rep);el.addEventListener('focus',rep);el.addEventListener('keyup',rep);}
document.addEventListener('selectionchange',()=>{const a=document.activeElement;if(a&&a.value!==undefined)rep({target:a,type:'sel'});});
const clr=document.getElementById('clr');clr.addEventListener('pointerdown',e=>e.preventDefault());clr.addEventListener('mousedown',e=>e.preventDefault());
clr.addEventListener('click',e=>{e.preventDefault();const a=document.activeElement;if(a&&a.value!==undefined){a.value='';rep({target:a,type:'clear'});}});
</script></body></html>
