# 不加進 repo 的 workspace（.scratch/m3/spec.md〈共同規則〉）：空的 [workspace] 讓它自成一個。
[package]
name = "model-ladder"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
qim-bench = { path = "../../../crates/qim-bench" }
qim-core = { path = "../../../crates/qim-core" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
debug = false
# 神經模型的延遲和 ../neural-cost 同樣編法才比得起來。
lto = true
codegen-units = 1
