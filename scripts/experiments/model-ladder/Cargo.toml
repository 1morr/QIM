# 不加進 repo 的 workspace（.scratch/m3/spec.md〈共同規則〉）：空的 [workspace] 讓它自成一個。
[package]
name = "model-ladder"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
qim-bench = { path = "../../../crates/qim-bench" }
qim-core = { path = "../../../crates/qim-core" }
qim-databuild = { path = "../../../crates/qim-databuild" }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
debug = false
