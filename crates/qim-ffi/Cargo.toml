[package]
name = "qim-ffi"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# staticlib 給 Swift 連結（Apple 平台的殼），uniffi 的 library mode 也從它讀介面；lib 給 Rust 的測試。
crate-type = ["lib", "staticlib"]

[dependencies]
qim-core = { version = "0.0.0", path = "../qim-core" }
uniffi = "0.32.2"

[features]
# 只在產生綁定時開（`cargo xtask ffi`）：uniffi 的 CLI 依賴多，不進函式庫。
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]
