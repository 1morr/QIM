[package]
name = "qim-databuild"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bzip2 = "0.6.1"
ferrous-opencc = "0.4.0"
qim-core = { version = "0.0.0", path = "../qim-core" }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.1.8"
ureq = "3.5.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
