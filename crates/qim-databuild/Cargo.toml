[package]
name = "qim-databuild"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bzip2 = "0.6.1"
dirs = "7.0.0"
ferrous-opencc = "0.4.0"
qim-core = { version = "0.0.0", path = "../qim-core" }
qim-layout = { version = "0.0.0", path = "../qim-layout" }
qim-neural = { version = "0.0.0", path = "../qim-neural" }
quick-xml = "0.42.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
ureq = "3.5.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"

# 設計實驗（scripts/experiments/），不進資料管線；跟著 clippy、test 編譯，API 改了會先發現。
[[example]]
name = "s2hk-diff"
path = "../../scripts/experiments/s2hk-diff/main.rs"

[[example]]
name = "lexicon-forms"
path = "../../scripts/experiments/lexicon-forms/main.rs"

[[example]]
name = "emoji-keywords"
path = "../../scripts/experiments/emoji-keywords/main.rs"
