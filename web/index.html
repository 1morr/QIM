<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>QIM</title>
	</head>
	<body>
		<main>
			<textarea id="text" aria-label="輸入框" rows="4" readonly></textarea>
			<div id="composition" data-testid="composition"></div>
			<div class="candidate-bar">
				<span id="mode" data-testid="mode" title="單按 Shift 切換中英">中</span>
				<ol id="candidates" aria-label="候選"></ol>
				<button id="expand" type="button" aria-label="展開候選" aria-expanded="false" aria-controls="panel" hidden>⌄</button>
				<button id="phrases-open" type="button" aria-expanded="false" aria-controls="phrase-picker">常用語</button>
			</div>
			<ol id="panel" aria-label="全部候選" hidden></ol>
			<ul id="phrase-picker" aria-label="選常用語" hidden></ul>
			<p id="status" role="status">載入中…</p>
			<div class="toolbar">
				<button id="touch-toggle" type="button" aria-pressed="false">觸控鍵盤</button>
				<button id="dark-toggle" type="button" aria-pressed="false">深色</button>
				<label><input type="checkbox" id="number-row" /> 數字列</label>
				<label>字根提示
					<select id="hint-version">
						<option value="cangjie5" selected>倉頡五代</option>
						<option value="cangjie3">倉頡三代</option>
					</select>
				</label>
			</div>
			<div id="keyboard" data-testid="keyboard" hidden></div>
			<section id="settings" aria-label="設定">
				<div id="settings-options" class="settings-options"></div>
				<section id="phrases" aria-label="常用語">
					<h2>常用語</h2>
					<ul id="phrase-list" aria-label="常用語清單"></ul>
					<form id="phrase-form">
						<label>常用語 <textarea id="phrase-text" rows="3" required></textarea></label>
						<label>觸發詞（可不填） <input id="phrase-trigger" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" /></label>
						<button id="phrase-save" type="submit">新增</button>
						<button id="phrase-cancel" type="button" hidden>取消編輯</button>
					</form>
					<p class="note">打觸發詞時它是首選；沒有觸發詞的從候選列的「常用語」選。</p>
					<p id="phrase-status" role="status" aria-label="常用語狀態"></p>
				</section>
				<section id="word-list" aria-label="匯入詞庫">
					<h2>匯入詞庫</h2>
					<label>詞表檔案 <input id="import-word-list" type="file" accept=".txt,.yaml,.tsv,text/plain" aria-describedby="word-list-note" /></label>
					<p id="word-list-note" class="note">收 Rime 碼表（.dict.yaml）、Gboard 個人字典的 dictionary.txt（先解壓匯出的 zip）、一行一詞的純文字。碼由字推出，Gboard 的快捷鍵預設不設成觸發詞（確認時可勾選）；詞是加進使用者詞，不動原本的學習資料。</p>
					<fieldset id="confirm-word-list" aria-label="確認匯入詞庫" hidden>
						<p id="confirm-word-list-text"></p>
						<div id="word-list-shortcuts" hidden>
							<label><input id="word-list-as-triggers" type="checkbox" /> 把 Gboard 快捷鍵設成觸發詞</label>
							<p id="word-list-shortcuts-text" class="note"></p>
							<ul id="word-list-triggers" aria-label="能設成觸發詞的快捷鍵"></ul>
						</div>
						<button id="confirm-word-list-ok" type="button">確定匯入</button>
						<button id="confirm-word-list-cancel" type="button">取消</button>
					</fieldset>
					<p id="word-list-status" role="status" aria-label="詞庫匯入狀態"></p>
					<ul id="word-list-skipped" aria-label="略過的列"></ul>
					<ul id="word-list-unused" aria-label="不能設成觸發詞的快捷鍵"></ul>
				</section>
			</section>
			<section id="user-dict" aria-label="使用者詞">
				<form id="add-word">
					<label>詞 <input id="word" type="text" required /></label>
					<label>觸發詞 <input id="trigger" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" /></label>
					<button type="submit">加詞</button>
				</form>
				<div>
					<button id="export-user-dict" type="button">匯出學習資料</button>
					<label>匯入學習資料（取代目前的） <input id="import-user-dict" type="file" accept=".tsv,.txt,text/tab-separated-values,text/plain" aria-describedby="import-note" /></label>
					<button id="clear-user-dict" type="button">清空學習資料</button>
				</div>
				<p id="import-note" class="note">匯入會用檔案的內容覆蓋目前全部的學習資料，不是合併；要保留目前的，先匯出。</p>
				<fieldset id="confirm-import" aria-label="確認匯入" hidden>
					<p id="confirm-import-text"></p>
					<button id="confirm-import-ok" type="button">確定匯入</button>
					<button id="confirm-import-cancel" type="button">取消</button>
				</fieldset>
				<p id="user-dict-status" role="status" aria-label="學習資料狀態"></p>
			</section>
			<section id="report-panel" aria-label="回報">
				<button id="report" type="button" disabled>回報</button>
				<label for="reports">回報的固定題（<code>bench/fixed.tsv</code> 的行；期望的字不對可以直接改）</label>
				<textarea id="reports" rows="3" spellcheck="false"></textarea>
				<button id="copy-reports" type="button">複製全部</button>
			</section>
		</main>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
