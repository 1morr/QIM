<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>QIM</title>
	</head>
	<body>
		<main>
			<textarea id="text" aria-label="輸入框" rows="4" readonly></textarea>
			<div id="composition" data-testid="composition"></div>
			<ol id="candidates" aria-label="候選"></ol>
			<p id="status" role="status">載入中…</p>
			<div class="toggles">
				<button id="touch-toggle" type="button" aria-pressed="false">觸控鍵盤</button>
				<button id="dark-toggle" type="button" aria-pressed="false">深色</button>
			</div>
			<div id="keyboard" data-testid="keyboard" hidden></div>
		</main>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
